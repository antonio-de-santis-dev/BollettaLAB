server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 2m;
 server_tokens off;
 gzip on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 # nginx drops inherited add_header lines when a location adds its own, so each one includes them.
 include /etc/nginx/security_headers.lab;
 location /health { access_log off; return 200 'ok'; }
 location /internal { return 404; }
 location /api/utenti/ { proxy_pass http://utenti:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/pagamento/ { proxy_pass http://pagamento:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/luce/ { proxy_pass http://luce:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/luce-business/ { proxy_pass http://luce-business:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/gas/ { proxy_pass http://gas:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/ { return 404; }
 # Vite file names contain a content hash: they never change, so browsers keep them for a year.
 location /assets/ {
  include /etc/nginx/security_headers.lab;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
 }
 location / {
  include /etc/nginx/security_headers.lab;
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ /index.html;
 }
}
