server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'self' blob:" always;
 location /health { access_log off; return 200 'ok'; }
 location /internal { return 404; }
 location /api/utenti/ { proxy_pass http://utenti:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/pagamento/ { proxy_pass http://pagamento:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/luce/ { proxy_pass http://luce:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/luce-business/ { proxy_pass http://luce-business:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/gas/ { proxy_pass http://gas:8080/api/; include /etc/nginx/proxy_params.lab; }
 location /api/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
