name: BollettaLAB checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: java-test-results
          path: '**/target/surefire-reports/'
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  mysql-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start five services and MySQL
        run: ./scripts/start.sh
      - name: HTTP regressions
        run: python3 scripts/smoke.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser regressions
        run: |
          set -a
          source .env
          set +a
          cd frontend
          TEST_ADMIN_EMAIL="$ADMIN_EMAIL" TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" npm run test:e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > container-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            container-logs.txt
      - if: always()
        run: docker compose down
