server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: utenti
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/utenti}
    username: ${DB_USER:utenti}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
platform:
  service: utenti
  internal-key: ${INTERNAL_KEY}
  public-url: ${PUBLIC_URL:http://localhost:8091}
  payment-url: ${PAYMENT_URL:http://pagamento:8080}
  cookie-secure: ${COOKIE_SECURE:true}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  mail-from: ${MAIL_FROM:noreply@bollettalab.it}
